name: Daily Stock AI Pipeline

on:
  schedule:
    # Runs weekdays after the U.S. market close. GitHub schedules use UTC.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - fast

permissions:
  contents: write

concurrency:
  group: daily-stock-ai-pipeline
  cancel-in-progress: false

jobs:
  refresh-data-and-models:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create runtime .env
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "FINNHUB_API_KEY GitHub secret is missing." >&2
            exit 1
          fi
          printf "FINNHUB_API_KEY=%s\n" "$FINNHUB_API_KEY" > .env

      - name: Run full pipeline
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        run: python run_pipeline.py

      - name: Run fast pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fast'
        run: python run_pipeline.py --fast

      - name: Write refresh marker
        run: |
          mkdir -p reports
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          Path("reports/last_refresh_utc.txt").write_text(
              datetime.now(timezone.utc).isoformat(timespec="seconds"),
              encoding="utf-8",
          )
          PY

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models reports
          git diff --cached --quiet && echo "No refreshed artifacts to commit." || git commit -m "chore: refresh daily stock AI artifacts"
          git push
